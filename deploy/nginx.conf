# /etc/nginx/conf.d/pathview.conf
#
# 反代 PathView：静态资源与 API 都走同一个上游端口（后端单进程托管），
# 所以只需要一个 location，不必区分前后端。
#
# 部署步骤见 DEPLOY.md「方案 B」。域名换好后先放 HTTP 版本，
# 再执行 certbot 自动改写为 HTTPS。

# ---------- 上游（可选：显式声明便于统一改端口） ----------
upstream pathview_upstream {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name pathview.example.com;      # ← 改成你的域名，没有域名就写服务器公网 IP

    # 单条轨迹动辄上万点、CSV 可能很大；后端 JSON 限制 64m，这里留足余量
    client_max_body_size 128m;
    client_body_timeout 300s;

    # gzip（前端产物 1.2MB → 约 330KB）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/xml image/svg+xml;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- 访问保护 ----------
    # PathView 本身没有登录功能，公网部署强烈建议开启 Basic Auth：
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd youruser
    # 然后把下面两行取消注释（对整站生效，包括 API）：
    #
    # auth_basic "PathView";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # 带内容 hash 的构建产物，可长缓存
    location /assets/ {
        proxy_pass http://pathview_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API：上传/解析可能耗时，放宽超时；关闭请求缓冲让大文件直通后端
    location /api/ {
        proxy_pass http://pathview_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA 入口与其余请求
    location / {
        proxy_pass http://pathview_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# ---------- HTTPS ----------
# 执行 `sudo certbot --nginx -d pathview.example.com` 后，certbot 会自动
# 在上面的 server 块里补上 listen 443 ssl 与证书路径，并追加 80→443 跳转，
# 无需手写。若手动配置，形如：
#
# server {
#     listen 443 ssl http2;
#     server_name pathview.example.com;
#     ssl_certificate     /etc/letsencrypt/live/pathview.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/pathview.example.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#     # …… 其余 location 与上面 80 端口版本一致
# }
