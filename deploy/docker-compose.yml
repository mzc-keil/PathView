# PathView 单容器部署：一条命令拉起（含前端静态资源 + API + SQLite）
#
# 用法（在项目根目录执行）：
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f
#   docker compose -f deploy/docker-compose.yml down
#
# 数据落在命名卷 pathview-data 里，重建容器不会丢。

services:
  pathview:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: pathview:latest
    container_name: pathview
    restart: unless-stopped

    # 只绑到本机，由宿主 Nginx 反代出去；要直接对外可改成 "3001:3001"
    ports:
      - "127.0.0.1:3001:3001"

    environment:
      PORT: "3001"
      PV_DATA_DIR: /data
      TZ: Asia/Shanghai

    volumes:
      - pathview-data:/data

    # 同步 SQLite 在 1核512M 机器上也够用；留点余量
    deploy:
      resources:
        limits:
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pathview-data:
